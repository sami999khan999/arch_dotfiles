# Which portal backend does what on Hyprland (overrides /usr/share/xdg-desktop-portal/hyprland-portals.conf).
# Open / Save dialogs: Files' picker (local/lib/panels/pickergui.py), GTK's if it isn't installed;
# "Open with…": its app chooser (openwithgui.py), the same way.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=sami;gtk
org.freedesktop.impl.portal.AppChooser=sami;gtk
