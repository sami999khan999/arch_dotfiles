# Drop-in for every tmux pane's scope (tmux-spawn-*.scope; linked by setup/install.sh): the memory a pane
# uses, up to 3 GB, is reclaimed (swapped) only after everyone else's. That's where the dev servers and the
# agents run (agentmux), and a dev server swapped out while you were in the browser took 30 s to answer
# its next request. Needs MemoryLow on every parent too: app-memory.conf, and system/root-setup.sh step 5.
[Scope]
MemoryLow=3G
