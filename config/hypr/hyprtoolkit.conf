# hyprtoolkit — Tokyo Night, square corners. Same colors as waybar, walker, mako and the Control Center.
# Used by hyprtoolkit apps such as hyprpolkitagent (the password prompt).

background       = rgb(1a1b26)
base             = rgb(24283b)
alternate_base   = rgb(292e42)
text             = rgb(c0caf5)
bright_text      = rgb(c0caf5)
link_text        = rgb(6b8fe0)
accent           = rgb(6b8fe0)
accent_secondary = rgb(73daca)

# "Nerd Font Mono" keeps icons one cell wide; the plain variant's wide eye glyph gets clipped in the password field
font_family           = JetBrainsMono Nerd Font Mono
font_family_monospace = JetBrainsMono Nerd Font Mono
h1_size         = 17
font_size       = 11
small_font_size = 10

rounding_large = 0
rounding_small = 0
