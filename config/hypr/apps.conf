# App hotkeys — like AutoHotkey's "activate the window, or run it".
#
#   Press the key:  jumps to that app's window (any workspace)
#   Press again:    cycles through its other windows
#   Not open yet:   launches it
#
# One mapping per line:   keys | window class | command to launch
#
#   keys          as in binds.lua: SUPER, SHIFT, CTRL, ALT joined with " + "
#   window class  find it with:  hyprctl clients | grep class
#                 (a regex, matched case-insensitively against the whole class)
#   command       what to run when no window is open
#
# Save the file, then reload Hyprland (hyprctl reload) to apply.
# Don't reuse a key already bound in config/binds.lua — both actions would fire.

SUPER + B    | google-chrome     | google-chrome-stable
SUPER + C    | kitty             | kitty
SUPER + E    | org.kde.dolphin   | dolphin
