# Omarchy kitty config — Tokyo Night
include themes/tokyo-night.conf

# Font
font_family      JetBrainsMono Nerd Font
bold_italic_font auto
font_size        11.0

# Window
window_padding_width    6
hide_window_decorations yes
confirm_os_window_close 0

# Copy/paste with plain Ctrl+C / Ctrl+V.
# copy_and_clear_or_interrupt: copies when text is selected (and clears the
# selection so the next Ctrl+C interrupts again), otherwise sends SIGINT.
map ctrl+c copy_and_clear_or_interrupt
# Ctrl+V is left to the app (fish and Claude Code paste text themselves, and
# Claude Code can then paste images); kitty's own paste is ctrl+shift+v / shift+insert.
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Allow remote access
allow_remote_control yes

# Aesthetics
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor
enable_audio_bell     no

# Minimal tab bar
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
