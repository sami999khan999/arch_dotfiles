# Look of the Control Center window (workspace 6). Everything else comes from kitty.conf.
include kitty.conf

font_size               10
window_padding_width    8
# thin dark pane borders; the pane you're using gets the accent color
window_border_width     1px
active_border_color     #6b8fe0
inactive_border_color   #3b4261
# easier to grab a border with the mouse (drag = resize just those two panes)
window_drag_tolerance   6

# panes as separate cards: a small gap between them, glass background (Hyprland blurs it)
window_margin_width     3
single_window_margin_width 0
background_opacity      0.92
