# Look of the agentmux window (Super + A). Everything else comes from kitty.conf.
include kitty.conf

# 10 at the top, 3 at the left (pt: 4px), nothing at the right or the bottom: every panel keeps its own
# 2-column margin (term.py PAD, 16px), so with the top's padding and half a row the space around
# matches on all sides. The 4px is half a column, the space tmux's dividers leave either side of
# their line: a selected row's band in Projects stops that far from the window's edge, as it does
# from the divider at its right. tmux's status bar sits on the window's bottom edge; it has no
# background of its own (config/agentmux/app.conf), so the few leftover pixels of the cell grid
# look like part of it.
window_padding_width    10 0 0 3
placement_strategy      top-left

# Text as sharp as the GTK panels (gtkkit.py: 10pt, slight hinting): the same size, a little air
# between lines like their rows, and crisper light-on-dark glyphs (kitty's default is soft there).
font_size                 10.0
modify_font               cell_height 118%
text_composition_strategy 1.2 20
# Lines as thin as GTK's: the column borders and rules 1px, the headers' underline (━) 2px.
# Thickness in pt for hairline, light, medium, heavy box-drawing characters.
box_drawing_scale         0.001, 0.75, 1.0, 1.5


# agentmux's thread keys reach tmux (cli.py apply_keys): kitty's own Ctrl+Tab / Ctrl+Shift+Tab switch kitty
# tabs (this window has one), and Ctrl+digit is sent as the plain digit. Sent as CSI u, which tmux reads
# with extended-keys (config/agentmux/app.conf) as C-Tab, C-BTab, C-1 … C-9
map ctrl+tab       send_text all \e[9;5u
map ctrl+shift+tab send_text all \e[9;6u
map ctrl+1         send_text all \e[49;5u
map ctrl+2         send_text all \e[50;5u
map ctrl+3         send_text all \e[51;5u
map ctrl+4         send_text all \e[52;5u
map ctrl+5         send_text all \e[53;5u
map ctrl+6         send_text all \e[54;5u
map ctrl+7         send_text all \e[55;5u
map ctrl+8         send_text all \e[56;5u
map ctrl+9         send_text all \e[57;5u
