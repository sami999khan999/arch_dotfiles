# app.conf — agentmux, the workspace (tmux -L agentmux): projects pane | agents pane | the thread |
# terminals. Only layout lives here; the threads are sessions on the agents server (agents.conf),
# shown by nested clients. Every action is a `agentmux <command>` (local/bin/agentmux).
# Keys have no prefix and use Ctrl + Alt, which nothing else takes: Hyprland owns Alt + 1…0 and
# Alt + Tab, Claude Code owns Alt + P / Alt + T.

set -g prefix None
unbind C-b
set -g escape-time 0
set -g focus-events on
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:hyperlinks:extkeys,tmux*:RGB:hyperlinks:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g set-titles on
set -g set-titles-string "agentmux"
set -g remain-on-exit off

# ---- look: Tokyo Night, quiet. No titles in the borders: each pane draws its own header (the
# sidebars, the home screen), and the thread is the agent's own interface. Borders are a faint line;
# the focused one turns blue.
set -g pane-border-status off
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#3b4261"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#292e42,fg=#c0caf5"
set -g popup-style "bg=#16161e,fg=#c0caf5"
set -g popup-border-style "fg=#3b4261"
set -g popup-border-lines rounded
set -g display-panes-colour "#565f89"

# ---- status bar: where you are on the left (and "maximized" while a panel is: agentmux maximize),
# the buttons (clickable ranges) on the right ----
# The buttons share one "Ctrl+Alt +": each shows only its key (amber) and what it does.
set -g status-position bottom
set -g status-interval 0
set -g status-style "bg=default,fg=#a9b1d6"
# two status lines: a thin #292e42 rule on the panes' own background (air, then the line), and the
# bar itself, also on the panes' background (no band of its own). (#{p999:@blank} is 999 spaces, turned into ─ and cut to width.)
set -g status 2
set -g @blank ""
set -g status-format[0] "#[fill=default]#[fg=#292e42]#{s/ /─/:#{p999:@blank}}"
set -g status-format[1] "#[fill=default]#[bg=default]#[align=left]#{T:status-left}#[align=right]#{T:status-right}"
set -g status-justify absolute-centre
set -g status-left-length 90
set -g status-right-length 160
set -g status-left " #[fg=#6b8fe0]#[bold]󰚩 agentmux#[nobold]#{?#{@project_name},#[fg=#3b4261]  ›  #[fg=#c0caf5]#[bold]#{@project_name}#[nobold],}#{?#{@thread_label},#[fg=#3b4261]  ›  #[fg=#a9b1d6]#{@thread_label},}#{?#{@max},#[fg=#3b4261]  ·  #[fg=#e0af68]󰊓 maximized,}"
# status-right (the buttons, with their shortcuts) is set by agentmux too: apply_keys()
set -g window-status-format ""
set -g window-status-current-format ""

bind -n MouseDown1Status run-shell -b "~/.local/bin/agentmux click '#{mouse_status_range}'"

# ---- keys ----
# The shortcuts aren't here: agentmux binds them from config/agentmux/settings.json (defaults in
# local/lib/agentmux/lib.py, ACTIONS), so they can be remapped in the settings panel (Ctrl+Alt+S).

# remember the column widths whenever one is dragged; after the window resizes too (that also gives
# the terminal list back the width a resize squeezed out of it)
# the colour theme (local/bin/theme): its colours for the options above
source-file -q ~/.config/themes/current/tmux-app.conf

set-hook -g after-resize-pane "run-shell -b '~/.local/bin/agentmux save-widths >/dev/null 2>&1'"
set-hook -g window-resized "run-shell -b '~/.local/bin/agentmux save-widths >/dev/null 2>&1'"
