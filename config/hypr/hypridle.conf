# Idle handling, after Omarchy's hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock           # avoid starting multiple instances
    before_sleep_cmd = loginctl lock-session        # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'      # turn the display back on after resume
    inhibit_sleep = 3                               # wait until the screen is locked
}

# Lock after 5 minutes
listener {
    timeout = 1200
    on-timeout = loginctl lock-session
}

# Screen off 30s later
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
