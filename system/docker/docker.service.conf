# docker.service drop-in (system/root-setup.sh installs it as
# /etc/systemd/system/docker.service.d/dotfiles.conf, with @USER@ filled in).
[Service]
# this system's default is 10 s, then SIGKILL: too short for dokployctl down and dockerd stopping every
# container (each gets 10 s itself), and a killed dockerd leaves containers that don't come back
TimeoutStopSec=120
# containers unreachable from the network (the rules are gone after a reboot: again at every start)
ExecStartPost=-/usr/local/lib/dotfiles/docker-firewall
# Dokploy never starts by itself: off as Docker stops (the Docker panel's switch, shutdown), and again
# as it starts in case Docker didn't stop cleanly (a crash, a power cut). Run as the user: dokployctl
# lives in their home, so it must not run as root
ExecStartPost=-/usr/bin/timeout 90 /usr/bin/runuser -u @USER@ -- @HOME@/.local/bin/dokployctl down --boot
ExecStop=-/usr/bin/timeout 90 /usr/bin/runuser -u @USER@ -- @HOME@/.local/bin/dokployctl down
