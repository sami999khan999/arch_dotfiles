# Look of the Control Center window (workspace 10). Everything else comes from kitty.conf.
# The cards and their borders are drawn by hypr/scripts/controlcenter.py on the character grid.
include kitty.conf

font_size               10
# 0 above/below, 10px left/right: with this screen's 8x18px cells that leaves ~16px from the
# screen edge (and the bar) to the cards — the same as the gaps between them. Leftover pixels
# from the cell grid are split evenly on both sides.
window_padding_width    0 10
placement_strategy      center
background_opacity      0.85
