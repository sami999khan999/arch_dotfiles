# agents.conf — the "agents" tmux server (tmux -L agents): every agentmux thread is a session here.
# The kitty beside a VS Code window and agentmux's middle pane both attach to these sessions, so this
# server must be invisible: no prefix key, no status bar, keys and mouse go straight to the agent.

set -g prefix None
unbind C-b
set -g status off
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g allow-rename off
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:hyperlinks:extkeys,tmux*:RGB:hyperlinks:extkeys"
# Shift+Enter and friends reach the agent (Claude Code's newline)
set -g extended-keys on
set -g extended-keys-format csi-u

# Two views of one thread (VS Code kitty + agentmux): the agent redraws at the size of the one you
# last typed in; the other shows it letterboxed until you type there.
set -g window-size latest
setw -g aggressive-resize on

# Copy and paste as in any terminal. The wheel scrolls the history. A drag, double click (word) or
# triple click (line) selects and keeps the highlight; it also goes to the primary selection
# (middle-click paste; the Audio Cursor extension reads selections from there). Ctrl+C copies the
# selection to the clipboard (with nothing selected it is Ctrl+C, interrupt); Ctrl+V and every other
# key drop the selection and go to the program; Esc or a click drops it. tmux's own copy-mode keys
# (Ctrl+V = page down, letters = commands) would swallow them, so that key table is rebuilt here.
set -g mouse on
set -g set-clipboard on
set -g copy-command "wl-copy --primary"
unbind -a -T copy-mode
bind -T copy-mode MouseDown1Pane select-pane \; send -X cancel
bind -T copy-mode MouseDrag1Pane select-pane \; send -X begin-selection
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -T copy-mode WheelUpPane select-pane \; send -X -N 5 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send -X -N 5 scroll-down
bind -T copy-mode C-c if -F "#{selection_present}" { send -X copy-pipe-and-cancel "wl-copy" } { send -X cancel ; send-keys C-c }
bind -T copy-mode Escape send -X cancel
bind -T copy-mode Any { send -X cancel ; send-keys }
# The mouse goes to the program when it asked for it (Claude Code, opencode: they select and copy
# themselves). Codex and agy ask for it too (Codex always) but can't select text: a drag or double /
# triple click there is tmux's selection, so Ctrl+C copies it. @to-app: the mouse goes to the program.
set -g @to-app "#{||:#{pane_in_mode},#{&&:#{mouse_any_flag},#{!:#{m/r:^(codex|agy)$,#{@harness}}}}}"
bind -n MouseDrag1Pane if -F "#{E:@to-app}" { send -M } { copy-mode -M }
# double / triple click outside copy mode: select and keep it (tmux's default copies and drops it at once)
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{E:@to-app}" { send -M } { copy-mode -H ; send -X select-word ; send -X copy-pipe-no-clear }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{E:@to-app}" { send -M } { copy-mode -H ; send -X select-line ; send -X copy-pipe-no-clear }

# Keys the agents read differently. They all asked for extended keys, so tmux sends Ctrl+<key> as a
# CSI-u sequence (Claude Code's Shift+Enter needs that).
# Ctrl+V: Codex takes it as "paste an image" and agy ignores it; there the clipboard's text is pasted
# by tmux, as a terminal paste (an image on the clipboard still goes to the agent: Codex pastes it).
bind -n C-v if -F "#{m/r:^(codex|agy)$,#{@harness}}" { run-shell -b "~/.local/bin/agentmux paste '#{pane_id}'" } { send-keys C-v }
# Ctrl+Backspace (kitty sends it as CSI-u): agy ignores it in every encoding; ^W deletes the word there
bind -n C-BSpace if -F "#{==:#{@harness},agy}" { send-keys -H 17 } { send-keys C-BSpace }

# a viewer left: close threads that are only an idle shell nobody watches (agentmux reap)
set-hook -g client-detached "run-shell -b '~/.local/bin/agentmux reap'"

# Tokyo Night, for a split inside a thread or a terminal
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#6b8fe0"
set -g pane-border-lines single
set -g mode-style "bg=#292e42,fg=#c0caf5"
set -g message-style "bg=#16161e,fg=#c0caf5"

# the agentmux shortcuts that act in a thread (Ctrl+Alt+L, read aloud) are bound here by agentmux
# apply-keys, also when this server starts on its own (a thread opened from VS Code's kitty)
run-shell -b '~/.local/bin/agentmux apply-keys >/dev/null 2>&1'

# the colour theme (local/bin/theme): its colours for the options above
source-file -q ~/.config/themes/current/tmux-agents.conf
