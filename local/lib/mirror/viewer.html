<!doctype html>
<!-- viewer.html — this PC's screen on the phone, served by mirror.py (mirror share) at https://<PC>:53321/#<token>.
     noVNC draws the screen and sends touches (tap = click, long press = right click, two fingers = scroll,
     drag = drag); the bar on top: keyboard, Esc, Tab, Super, next screen, sound, files, end. Files: the
     phone's files up to the PC's ~/Downloads, and the PC's (offered with mirror send) down, each fetched into
     memory and saved from there, so no address with the token is left in the phone's downloads. As a second screen
     (mirror share --extend) the page says its size first (/hello), so the PC makes that screen to fit. Leaves nothing in the
     browser: no cookies, no storage, never cached (no-store), the token taken out of the address once read. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1a1b26">
<title>PC screen</title>
<style>
  :root { --base: #1a1b26; --overlay: #292e42; --line: #3b4261; --muted: #565f89; --text: #c0caf5;
          --accent: #6b8fe0; --alert: #f7768e; --amber: #e0af68; --green: #9ece6a; }
  html, body { margin: 0; height: 100%; background: var(--base); color: var(--text); overflow: hidden;
               font: 15px "JetBrains Mono", ui-monospace, monospace; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; inset: 0; }
  #bar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; z-index: 2;
         background: color-mix(in srgb, var(--base) 88%, transparent); border: 1px solid var(--line); border-top: 0; }
  #bar.hidden button:not(#grip) { display: none; }
  #bar button { background: none; color: var(--text); border: 0; padding: 9px 12px; font: inherit; }
  #bar button:active, #bar button.on { background: var(--overlay); color: var(--accent); }
  #bar #end { color: var(--alert); }
  #grip { color: var(--muted) !important; }
  #keys { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; }
  #cover { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; gap: 14px;
           align-items: center; justify-content: center; background: var(--base); text-align: center; padding: 24px; }
  #cover h1 { margin: 0; font-size: 18px; font-weight: normal; color: var(--accent); }
  #cover p { margin: 0; color: var(--muted); max-width: 30em; line-height: 1.5; }
  #cover button { background: var(--accent); color: var(--base); border: 0; padding: 12px 26px; font: inherit; }
  #cover.bad h1 { color: var(--alert); }
  #files { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); z-index: 2; display: none;
           width: min(30em, calc(100vw - 32px)); max-height: calc(100vh - 60px); overflow-y: auto;
           background: var(--base); border: 1px solid var(--line); padding: 14px 16px; }
  #files.open { display: block; }
  #files h2 { margin: 0 0 8px; font-size: 13px; font-weight: normal; color: var(--muted); }
  #files h2 + * { margin-bottom: 14px; }
  #files .row { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  #files .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files .size, #files .note { color: var(--muted); font-size: 13px; }
  #files .done { color: var(--green); }
  #files .bad { color: var(--alert); }
  #files button { background: var(--accent); color: var(--base); border: 0; padding: 8px 14px; font: inherit; }
  #files button.flat { background: var(--overlay); color: var(--text); }
  #pick { display: none; }
  #fls.new { color: var(--amber); }
</style>
</head>
<body>
<div id="screen"></div>
<div id="bar" class="hidden">
  <button id="kbd">Keys</button><button id="esc">Esc</button><button id="tab">Tab</button>
  <button id="super">Super</button><button id="next">Screen</button><button id="snd">Sound</button>
  <button id="fls">Files</button><button id="end">End</button><button id="grip">≡</button>
</div>
<div id="files">
  <h2>To the PC (its Downloads folder)</h2>
  <div><button id="up">Choose files</button><div id="sent"></div></div>
  <h2>From the PC</h2>
  <div id="offers"></div>
</div>
<input id="pick" type="file" multiple>
<textarea id="keys" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<div id="cover">
  <h1>PC screen</h1>
  <p>Tap to connect. Tap = click, long press = right click, two fingers = scroll. ≡ shows the keys.</p>
  <button id="go">Connect</button>
</div>
<script type="module">
import RFB from "./novnc/core/rfb.js";
import KeyTable from "./novnc/core/input/keysym.js";
import keysyms from "./novnc/core/input/keysymdef.js";

// the token: read once, then gone from the address (and so from the history, if this isn't a private tab)
const token = location.hash.slice(1);
history.replaceState(null, "", "/");
const ws = (path) => `wss://${location.host}${path}?t=${encodeURIComponent(token)}`;
const $ = (id) => document.getElementById(id);
let rfb = null, sound = null, wake = null;

function cover(title, text, button) {
  $("cover").style.display = "";
  $("cover").className = "bad";
  $("cover").querySelector("h1").textContent = title;
  $("cover").querySelector("p").textContent = text;
  $("go").style.display = button ? "" : "none";
}

async function connect() {
  $("cover").style.display = "none";
  // the size in real pixels, landscape: an extended screen is made at it, before wayvnc starts on it
  const dpr = devicePixelRatio || 1;
  const w = Math.round(Math.max(screen.width, screen.height) * dpr / 2) * 2;
  const h = Math.round(Math.min(screen.width, screen.height) * dpr / 2) * 2;
  try {
    const r = await fetch(`/hello?t=${encodeURIComponent(token)}&w=${w}&h=${h}`, { cache: "no-store" });
    if ((await r.json()).extend) $("next").style.display = "none";
  } catch {}
  rfb = new RFB($("screen"), ws("/vnc"), { wsProtocols: ["binary"] });
  rfb.scaleViewport = true;
  rfb.qualityLevel = 6;
  rfb.compressionLevel = 2;
  rfb.focusOnClick = false;   // the phone's keyboard opens only from Keys
  rfb.addEventListener("disconnect", (e) => {
    rfb = null;
    stopSound();
    cover(e.detail.clean ? "Disconnected" : "Couldn't connect",
          "Sharing may have stopped on the PC, or another phone is watching. Start it again there and scan the new code.",
          false);
  });
}

// ---- sound: raw 48 kHz s16le stereo, scheduled a little ahead ----
function startSound() {
  const ctx = new AudioContext({ sampleRate: 48000 });
  const sock = new WebSocket(ws("/sound"));
  sock.binaryType = "arraybuffer";
  let next = 0;
  sock.onmessage = (m) => {
    const pcm = new Int16Array(m.data), n = pcm.length / 2;
    const buf = ctx.createBuffer(2, n, 48000);
    const l = buf.getChannelData(0), r = buf.getChannelData(1);
    for (let i = 0; i < n; i++) { l[i] = pcm[2 * i] / 32768; r[i] = pcm[2 * i + 1] / 32768; }
    const now = ctx.currentTime;
    if (next < now + 0.03 || next > now + 0.3) next = now + 0.06;   // fell behind or drifted: start over
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(next);
    next += buf.duration;
  };
  sound = { ctx, sock };
  $("snd").classList.add("on");
}

function stopSound() {
  if (!sound) return;
  sound.sock.close();
  sound.ctx.close();
  sound = null;
  $("snd").classList.remove("on");
}

// ---- keys ----
function tap(keysym) {
  if (!rfb) return;
  rfb.sendKey(keysym, null, true);
  rfb.sendKey(keysym, null, false);
}

// The phone's keyboard types into a hidden field; what changed in it becomes key presses. It starts full
// of filler so Backspace always has something to delete (an empty field sends no event for it).
const FILL = "_".repeat(64);
const keys = $("keys");
keys.value = FILL;
let last = FILL;
keys.addEventListener("input", () => {
  const now = keys.value;
  let same = 0;
  while (same < last.length && same < now.length && last[same] === now[same]) same++;
  for (let i = same; i < last.length; i++) tap(KeyTable.XK_BackSpace);
  for (const ch of now.slice(same)) tap(ch === "\n" ? KeyTable.XK_Return : keysyms.lookup(ch.codePointAt(0)));
  last = now;
  if (now.length < 16 || now.length > 256) { keys.value = FILL; last = FILL; }
});

$("kbd").onclick = () => (document.activeElement === keys ? keys.blur() : keys.focus());
$("esc").onclick = () => tap(KeyTable.XK_Escape);
$("tab").onclick = () => tap(KeyTable.XK_Tab);
$("super").onclick = () => tap(KeyTable.XK_Super_L);
$("next").onclick = () => fetch(`/screen?t=${encodeURIComponent(token)}`, { cache: "no-store" });
$("snd").onclick = () => (sound ? stopSound() : startSound());
$("grip").onclick = () => $("bar").classList.toggle("hidden");
$("end").onclick = () => { stopSound(); rfb?.disconnect(); };

// ---- files ----
const size = (n) => n < 1024 ? `${n} B` : n < 1 << 20 ? `${(n / 1024).toFixed(0)} KB` :
                    n < 1 << 30 ? `${(n / 1048576).toFixed(1)} MB` : `${(n / 1073741824).toFixed(2)} GB`;

function row(name, n) {
  const r = document.createElement("div");
  r.className = "row";
  const t = document.createElement("span");
  t.className = "name";
  t.textContent = name;
  const z = document.createElement("span");
  z.className = "size";
  z.textContent = size(n);
  r.append(t, z);
  return r;
}

$("fls").onclick = () => { $("files").classList.toggle("open"); $("fls").classList.remove("new"); };
$("up").onclick = () => $("pick").click();
$("pick").onchange = () => {
  for (const file of $("pick").files) upload(file);
  $("pick").value = "";
};

function upload(file) {
  const r = row(file.name, file.size), state = r.querySelector(".size");
  $("sent").append(r);
  const req = new XMLHttpRequest();   // fetch can't tell an upload's progress
  req.open("POST", `/upload?t=${encodeURIComponent(token)}&name=${encodeURIComponent(file.name)}`);
  req.upload.onprogress = (e) => { state.textContent = `${Math.floor(100 * e.loaded / e.total)} %`; };
  req.onload = () => {
    const ok = req.status === 200;
    state.textContent = ok ? "sent" : req.status === 507 ? "PC is full" : "failed";
    state.className = ok ? "size done" : "size bad";
  };
  req.onerror = () => { state.textContent = "failed"; state.className = "size bad"; };
  req.send(file);
}

// what the PC offers: told over a WebSocket as it happens, fetched only when Save is tapped
function offer(o) {
  if (!$("offers").querySelector(".row")) $("offers").textContent = "";
  const r = row(o.name, o.size), save = document.createElement("button");
  save.textContent = "Save";
  save.className = "flat";
  save.onclick = async () => {
    save.disabled = true;
    const state = r.querySelector(".size");
    try {
      const res = await fetch(`/file?t=${encodeURIComponent(token)}&id=${encodeURIComponent(o.id)}`, { cache: "no-store" });
      if (!res.ok) throw new Error();
      const reader = res.body.getReader(), parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        got += value.length;
        state.textContent = `${Math.floor(100 * got / o.size)} %`;
      }
      const url = URL.createObjectURL(new Blob(parts));
      const a = document.createElement("a");
      a.href = url;
      a.download = o.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      state.textContent = "saved";
      state.className = "size done";
    } catch {
      state.textContent = "failed";
      state.className = "size bad";
    }
    save.disabled = false;
  };
  r.append(save);
  $("offers").append(r);
  if (!$("files").classList.contains("open")) $("fls").classList.add("new");
}

function listen() {
  const sock = new WebSocket(ws("/events"));
  sock.onmessage = (m) => offer(JSON.parse(m.data));
  sock.onclose = () => { if (rfb) setTimeout(listen, 3000); };   // back with the screen; all offers again
  $("offers").innerHTML = '<p class="note">Nothing yet: send files from the Mirror panel on the PC.</p>';
}

$("go").onclick = async () => {
  if (!token) return cover("No code", "Scan the code shown on the PC again.", false);
  try { await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch {}
  try { await screen.orientation.lock("landscape"); } catch {}
  try { wake = await navigator.wakeLock.request("screen"); } catch {}
  await connect();
  startSound();
  listen();   // needs this tap: browsers start sound only from one
};
</script>
</body>
</html>
