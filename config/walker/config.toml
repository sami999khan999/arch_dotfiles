force_keyboard_focus = true                                                 # forces keyboard forcus to stay in Walker
selection_wrap = true                                                       # wrap list if at bottom or top
theme = "omarchy-default"                                                   # theme to use
additional_theme_location = "~/.config/walker/themes/"
hide_action_hints = false                                                   # shown for the clipboard; the launcher and symbols pass --nohints

[placeholders]
"default" = { input = " Search...", list = "No Results" } # placeholders for input and empty list, key is the providers name, so f.e. "desktopapplications" or "menus:other"

[keybinds]
quick_activate = []

[columns]
symbols = 1 # providers to be queried by default

[providers]
max_results = 256 # 256 should be enough for everyone
default = [
  "desktopapplications",
  "websearch",
]

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

# the clipboard's keys (shown under the list): pinned items stay, on top (config/elephant/clipboard.toml)
[providers.actions]
clipboard = [
  { action = "copy", default = true, bind = "Return" },
  { action = "pin", bind = "ctrl p", after = "AsyncClearReload" },
  { action = "unpin", bind = "ctrl p", after = "AsyncClearReload" },
  { action = "remove", label = "delete", bind = "ctrl d", after = "SimpleDelete" },
  { action = "remove_all", label = "clear all", bind = "ctrl shift d", after = "AsyncClearReload" },
  { action = "show_pinned_only", label = "only pinned", bind = "ctrl i", after = "AsyncClearReload" },
  { action = "show_images_only", label = "only images", bind = "ctrl i", after = "AsyncClearReload" },
  { action = "show_text_only", label = "only text", bind = "ctrl i", after = "AsyncClearReload" },
  { action = "show_combined", label = "show all", bind = "ctrl i", after = "AsyncClearReload" },
  { action = "edit", bind = "ctrl o" },
]

[[emergencies]]
text = "Restart Walker"
command = "sh -c 'pkill walker; setsid walker --gapplication-service &'"
