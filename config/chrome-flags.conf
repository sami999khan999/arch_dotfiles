# Chrome's command-line flags: /usr/bin/google-chrome-stable reads this file (~/.config/chrome-flags.conf)
# at every start. Its policies are system/chrome_*.json (root-setup.sh).
#
# One renderer per site instead of one per tab: many tabs of the same site (GitHub, Docs, a dev server)
# share a process, so ~60 tabs no longer mean ~60 renderers each with its own memory and timers.
--process-per-site
