# The fallback lock screen — the usual one is local/lib/lockscreen/locker.py; local/bin/lockscreen starts
# hyprlock only if that can't lock or dies while locked. The same layout without the animation: the
# wallpaper dimmed and blurred, one card in the middle with the clock, the date, the password. Tokyo Night.

$color       = rgba(26, 27, 38, 1.0)
$inner_color = rgba(41, 46, 66, 1.0)
$outer_color = rgba(59, 66, 97, 1.0)
$font_color  = rgba(192, 202, 245, 1.0)
$check_color = rgba(107, 143, 224, 1.0)
$fail_color  = rgba(247, 118, 142, 1.0)
$sub_color   = rgba(169, 177, 214, 1.0)
$muted_color = rgba(86, 95, 137, 1.0)
$card_color  = rgba(26, 27, 38, 0.85)
$card_border = rgba(59, 66, 97, 0.7)
# the colour theme (local/bin/theme): its colours for the above, which stay when it's missing
source = ~/.config/themes/current/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

auth {
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 4, ease
    animation = inputFieldFade, 1, 4, ease
}

background {
    monitor =
    color = $color
    path = ~/.local/state/wallpaper-current
    blur_passes = 3
    blur_size = 6
    brightness = 0.35
}

shape {
    monitor =
    size = 440, 300
    color = $card_color
    border_size = 1
    border_color = $card_border
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_family = JetBrainsMono Nerd Font ExtraBold
    font_size = 72
    position = 0, 68
    halign = center
    valign = center
}

# the date in English, whatever the system locale
label {
    monitor =
    text = cmd[update:60000] LC_ALL=en_US.UTF-8 date +"%A, %-d %B"
    color = $sub_color
    font_family = JetBrainsMono Nerd Font
    font_size = 13
    position = 0, 2
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 44
    position = 0, -72
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    check_color = $check_color
    fail_color = $fail_color
    outline_thickness = 1
    rounding = 0
    shadow_passes = 0

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true

    placeholder_text = <span alpha="45%">  $USER</span>
    check_text = <span alpha="70%">checking…</span>
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false
}
