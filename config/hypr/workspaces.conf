# Workspace groups — one workspace per kind of app, every window in it maximized.
#
#   Alt + 1…0          switch to window 1…0 of the current workspace (in the order they were opened)
#   Super + Ctrl + 1…0 go to that workspace; if its apps aren't open yet, launch them
#   Super + N          open another window of the current workspace's app
#   wsgroups tidy      move already-open windows to their workspaces
#   wsgroups list      show the groups and what's open in each
#
# One workspace per line:   workspace | name | window class | launch commands | new window | icon
#
#   window class   regex for the app's class; those windows always open on this workspace.
#                  Find it with:  hyprctl clients | grep class      Several apps: code, cursor
#   launch         what Super + Ctrl + N opens when the workspace has none of its apps yet.
#                  Separate several commands with  ;  — they open (and get numbered) in that order.
#                  Leave empty to only use the workspace rule.
#   new window     optional: what Super + N runs for another window of this workspace's app.
#                  Default: the first launch command.  -  = none.
#   icon           optional: the Nerd Font glyph on its waybar button (else its digit).
#
# Settings → Workspaces edits all of it, reorders the workspaces, and pins them to screens.
# Save, then `hyprctl reload`. Workspaces not listed here work as before.

1 | Agents   | agentmux      | kitty --config ~/.config/kitty/agentmux.conf --class agentmux -e ~/.local/bin/agentmux | ~/.local/bin/agentmux new | 󰚩
2 | Code     | code, com.microsoft.VSCode | code ~/dotfiles | code --new-window | 󰨞
3 | Web      | google-chrome | google-chrome-stable |  | 
4 | Terminal | kitty         | kitty |  | 
5 | Projects | sami.projects | ~/.local/lib/panels/projectsgui.py |  | 
7 | Files    | sami.files, org.kde.dolphin | ~/.local/lib/panels/filesgui.py | - | 
8 | Discord  | discord       | discord |  | 󰙯
9 | Docker   | sami.docker   | ~/.local/lib/panels/dockergui.py |  | 
10 | Control  | sami.controlcenter | ~/.local/lib/panels/ccgui.py | - | 󰕮
